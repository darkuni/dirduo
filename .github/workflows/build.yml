name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Unit tests against the oldest Qt we support (Ubuntu 24.04 ships Qt 6.4).
  test:
    name: Tests (Qt from Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools libgl-dev ninja-build pkgconf libtag1-dev libexiv2-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build
      - name: Test
        shell: bash
        run: |
          set +e
          ctest --test-dir build --output-on-failure 2>&1 | tee ctest.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            # Failing tests as annotations, readable without the full log.
            grep -E "^FAIL!|Loc: \[|Actual|Expected|tests failed|\*\*\*Failed|\(Failed\)|Timeout" ctest.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $status

  # KIO build: servers and archives, tested against a live FTP server and SSH
  # server started inside the job.
  test-kio:
    name: Tests with KIO (Ubuntu 26.04)
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt, KIO and test servers
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkgconf qt6-base-dev qt6-base-dev-tools \
            libkf6kio-dev extra-cmake-modules kio-extras kio6 libtag-dev libexiv2-dev \
            python3 python3-pyftpdlib openssh-server openssh-client dbus dbus-daemon
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build
      - name: Unit tests
        shell: bash
        run: |
          set +e
          ctest --test-dir build --output-on-failure 2>&1 | tee ctest.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            # Failing tests as annotations, readable without the full log.
            grep -E "^FAIL!|Loc: \[|Actual|Expected|tests failed|\*\*\*Failed|\(Failed\)|Timeout" ctest.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $status
      - name: Remote tests (FTP, SFTP, archives)
        run: timeout 300 tests/remote/run-remote-tests.sh build

  # One Flatpak per architecture: x86_64 for the Steam Deck, aarch64 for the
  # Steam Frame. Both build natively on GitHub's own runners.
  flatpak:
    name: Flatpak (${{ matrix.variant.arch }})
    needs: [test, test-kio]
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.variant.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Cache flatpak-builder downloads and builds
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: fb-${{ matrix.variant.arch }}-${{ hashFiles('flatpak/*.yml') }}-${{ github.sha }}
          restore-keys: |
            fb-${{ matrix.variant.arch }}-${{ hashFiles('flatpak/*.yml') }}-
            fb-${{ matrix.variant.arch }}-
      - name: Build Flatpak
        env:
          ARCH: ${{ matrix.variant.arch }}
        run: |
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # The log goes to a file; on failure its tail becomes an annotation,
          # readable without access to the raw job log.
          if ! flatpak-builder --arch="$ARCH" --repo=repo --disable-rofiles-fuse \
                 --install-deps-from=flathub --force-clean --ccache \
                 build-dir flatpak/com.monroeworld.Linopus.yml > build.log 2>&1; then
            # Annotations are cut at about 4 KB: send the error lines and the
            # end of the log in several pieces.
            { grep -nE "error|Error|ERROR|not found|Could NOT|FAILED|failed" build.log | grep -v "Performing Test" | tail -n 40
              echo "----- last lines -----"
              tail -n 40 build.log; } | tr -d '\r' | cut -c1-300 > tail.txt
            split -C 3000 tail.txt piece.
            for f in piece.*; do
              echo "::error title=flatpak-builder failed (${ARCH}) ${f}::$(sed 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"}{print}')"
            done
            exit 1
          fi
          tail -n 20 build.log
          flatpak build-bundle --arch="$ARCH" \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo linopus-"$ARCH".flatpak com.monroeworld.Linopus
      - uses: actions/upload-artifact@v4
        with:
          name: linopus-${{ matrix.variant.arch }}.flatpak
          path: linopus-${{ matrix.variant.arch }}.flatpak
