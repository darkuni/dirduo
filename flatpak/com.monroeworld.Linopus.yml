id: com.monroeworld.Linopus
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: linopus

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # A file manager needs the real filesystem, not the sandbox.
  - --filesystem=host
  - --filesystem=/run/media
  - --filesystem=/media
  - --filesystem=/mnt
  - --filesystem=/tmp
  # Button commands run real system tools through `flatpak-spawn --host`
  # (phase 3).
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: linopus
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DLINOPUS_BUILD_TESTS=OFF
    sources:
      - type: dir
        path: ..
        skip:
          - build
          - build-core
          - .flatpak-builder
          - flatpak-build
