id: com.monroeworld.Linopus
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: linopus

# Perl modules (needed to build Samba) install into /app, not the read-only /usr.
build-options:
  env:
    PERL5LIB: /app/lib/perl5:/app/lib/perl5/arch
    PERL_MM_OPT: INSTALL_BASE=/app

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # A file manager needs the real filesystem, not the sandbox.
  - --filesystem=host
  - --filesystem=/run/media
  - --filesystem=/media
  - --filesystem=/mnt
  - --filesystem=/tmp
  # Button commands run real system tools through `flatpak-spawn --host`
  # (phase 3).
  - --talk-name=org.freedesktop.Flatpak
  # Server passwords: KIO asks the desktop's password server and wallet.
  - --talk-name=org.kde.kiod6
  - --talk-name=org.kde.kded6
  - --talk-name=org.kde.kpasswdserver6
  - --talk-name=org.kde.kwalletd6
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.freedesktop.secrets
  # SSH keys and known hosts for SFTP live in ~/.ssh (covered by host).

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - '*.a'

modules:
  # SFTP support for KIO.
  - name: libssh
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DWITH_EXAMPLES=OFF
      - -DUNIT_TESTING=OFF
      - -DCLIENT_TESTING=OFF
      - -DSERVER_TESTING=OFF
      - -DWITH_GSSAPI=OFF
    sources:
      # libssh's GitHub mirror: git.libssh.org is not always reachable from CI.
      - type: git
        url: https://github.com/libssh/libssh-mirror.git
        tag: libssh-0.11.3
        commit: 301d0e16dfa8a5cac1cff956b6880ca90eb82864

  # SMB (Windows and Samba shares): Samba's client library for KIO's smb
  # worker, and what it takes to build it. Modules as in Flathub's Dolphin.
  - name: lmdb
    no-autogen: true
    make-install-args:
      - prefix=/app
    subdir: libraries/liblmdb
    # From LMDB's GitHub mirror: OpenLDAP's own server turns away CI downloads.
    sources:
      - type: git
        url: https://github.com/LMDB/lmdb.git
        tag: LMDB_1.0.0
        commit: 2562c3297402d82bbc049c7e645515edb4079eba

  - name: perl-modules
    buildsystem: simple
    build-commands:
      - cd Parse-Yapp && perl Makefile.PL && make && make install
      - cd JSON && perl Makefile.PL && make && make install
    post-install:
      - chmod -R u+w /app/lib/perl5
    sources:
      - type: archive
        dest: Parse-Yapp
        url: https://cpan.metacpan.org/authors/id/W/WB/WBRASWELL/Parse-Yapp-1.21.tar.gz
        sha256: 3810e998308fba2e0f4f26043035032b027ce51ce5c8a52a8b8e340ca65f13e5
      - type: archive
        dest: JSON
        url: https://cpan.metacpan.org/authors/id/I/IS/ISHIGAKI/JSON-4.11.tar.gz
        sha256: 713bdbe724dbb915ed50265ffe47e079a511980cb2427aa19076788bb64c3182

  - name: rpcgen
    sources:
      - type: archive
        url: https://github.com/thkukuk/rpcsvc-proto/releases/download/v1.4.4/rpcsvc-proto-1.4.4.tar.xz
        sha256: 81c3aa27edb5d8a18ef027081ebb984234d5b5860c65bd99d4ac8f03145a558b

  - name: samba
    config-opts:
      - --without-json
      - --without-ad-dc
      - --without-ldap
      - --without-ads
      - --without-pam
    sources:
      - type: archive
        url: https://samba.org/samba/ftp/stable/samba-4.24.4.tar.gz
        sha256: df2c51ab4361ec626ab9988e5946efcca8465bc7afae834291d5558468265ff8
      # Configure runs a test that switches user ids, which the build sandbox
      # does not allow when building as root (as CI does). Linux thread
      # credentials are what a normal build picks: check that it compiles
      # instead of running it.
      - type: shell
        commands:
          - sed -i '/HAVE_LINUX_THREAD_CREDENTIALS 1/,/thread-specific credentials/ s/execute=True/execute=False/' source3/wscript
          - grep -q 'execute=False' source3/wscript

  # Finds Windows machines on the network (WS-Discovery) for smb:/.
  - name: kdsoap
    buildsystem: cmake-ninja
    config-opts:
      - -DKDSoap_QT6=ON
    sources:
      - type: archive
        url: https://github.com/KDAB/KDSoap/releases/download/kdsoap-2.3.0/kdsoap-2.3.0.tar.gz
        sha256: d2184951145cb768cc30376a10701be13869a164c1272d09f831ba2d195f02de

  - name: kdsoap-ws-discovery-client
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_WITH_QT6=ON
    sources:
      - type: archive
        url: https://download.kde.org/stable/kdsoap-ws-discovery-client/kdsoap-ws-discovery-client-0.4.0.tar.xz
        sha256: 2cd247c013e75f410659bac372aff93d22d71c5a54c059e137b9444af8b3427a

  # The KIO workers that are not part of the KDE runtime: sftp, smb, fish,
  # archive (zip, tar, 7z as folders) and more.
  - name: kio-extras
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    # Fail here, not on the Deck, if the smb worker was left out.
    post-install:
      - find /app/lib -path '*kio*' -name '*smb*.so' | grep -q . || (echo 'kio-extras built without smb' && exit 1)
    sources:
      - type: git
        url: https://invent.kde.org/network/kio-extras.git
        tag: v25.08.3

  # Music tags for the Title, Artist, Album... columns.
  - name: taglib
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_TESTING=OFF
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_BINDINGS=OFF
    sources:
      - type: archive
        url: https://github.com/taglib/taglib/releases/download/v2.2.1/taglib-2.2.1.tar.gz
        sha256: 7e76b5299dcef427c486bffe455098470c8da91cf3ccb9ea804893df57389b5e

  # Photo details (camera, date taken, exposure) for the picture columns.
  - name: exiv2
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DEXIV2_BUILD_SAMPLES=OFF
      - -DEXIV2_BUILD_EXIV2_COMMAND=OFF
      - -DEXIV2_BUILD_UNIT_TESTS=OFF
      - -DEXIV2_BUILD_FUZZ_TESTS=OFF
      - -DEXIV2_ENABLE_NLS=OFF
      - -DEXIV2_ENABLE_INIH=OFF
      - -DEXIV2_ENABLE_BROTLI=OFF
      - -DEXIV2_ENABLE_WEBREADY=OFF
      - -DEXIV2_ENABLE_CURL=OFF
    sources:
      - type: git
        url: https://github.com/Exiv2/exiv2.git
        tag: v0.28.8
        commit: 2cd987a731236037b6b78cbff897d08685a8ef49

  - name: linopus
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DLINOPUS_BUILD_TESTS=OFF
      - -DLINOPUS_REQUIRE_LIBARCHIVE=ON
    sources:
      - type: dir
        path: ..
        skip:
          - build
          - build-core
          - build-kio
          - .flatpak-builder
          - flatpak-build
